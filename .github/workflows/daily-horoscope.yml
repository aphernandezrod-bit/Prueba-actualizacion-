name: Actualizar horóscopo diario

on:
  schedule:
    # 09:00 hora de Ciudad de México (UTC-6) todos los días
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-horoscope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar la lectura de hoy
        run: python3 scripts/generate_horoscope.py

      - name: Commitear y subir el cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "Sin cambios, el horóscopo de hoy ya estaba publicado."
          else
            git commit -m "Horóscopo del día $(date -u +'%Y-%m-%d')"
            git push
          fi
